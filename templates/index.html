<!DOCTYPE html>
<html>

<head>

<title>Crime Heatmap India</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#f1f5f9;
}

/* main container */

.container{
    max-width:1100px;
    margin:40px auto;
    padding:20px;
}

/* header */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.title{
    font-size:26px;
    font-weight:600;
}

/* dropdown */

select{
    padding:10px 14px;
    border-radius:8px;
    border:1px solid #cbd5e1;
    font-size:14px;
    background:white;
}

/* map card */

.map-card{
    background:white;
    padding:20px;
    border-radius:14px;

    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

/* map */

#map{
    height:550px;
    width:100%;
    border-radius:10px;
}

.stats-container{
    display:flex;
    gap:20px;
    margin-top:20px;
}

.stat-card{
    background:white;
    padding:20px;
    border-radius:12px;
    flex:1;

    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.stat-card h3{
    margin-top:0;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="title">India Crime Heatmap</div>

        <select id="crimeSelect">
            <option value="" selected disabled>Select Crime Type</option>

            {% for crime in crimes %}
            <option value="{{crime}}">{{crime}}</option>
            {% endfor %}
        </select>

    </div>

    <div class="map-card">
        <div id="map"></div>
    </div>

    <div class="stats-container">

    <div class="stat-card">
        <h3>Crime Statistics</h3>
        <p id="totalCases">Total Cases: -</p>
        <p id="citiesAffected">Cities Affected: -</p>
        <p id="highestCity">Highest City: -</p>
    </div>

    <div class="stat-card">
        <h3>Top Cities</h3>
        <ol id="topCities"></ol>
    </div>

    
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script src="/static/script.js"></script>

</body>
</html>
